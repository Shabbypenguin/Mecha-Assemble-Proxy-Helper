# Release build: push a version tag (git tag v0.6.0 && git push origin v0.6.0).
# Builds Windows and macOS (Apple Silicon + Intel), runs the tests and a start-up self-test on
# each, then attaches all zips to ONE *draft* GitHub Release with generated notes. Review the
# draft, then click Publish. Only published releases are offered by the app's update check.
# Manual run (Actions tab or `gh workflow run release.yml`): builds and keeps the zips as
# artifacts for 30 days, no release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_QPA_PLATFORM: offscreen   # GUI tests and the self-test run without a display
  PYTHONUTF8: "1"

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest        # Apple Silicon
            label: macos-apple-silicon
          - os: macos-15-intel      # GitHub offers Intel Macs until fall 2027
            label: macos-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev,gui]" pyinstaller

      - name: Read version
        id: version
        shell: bash
        run: |
          v=$(python -c "import mecha_proxy; print(mecha_proxy.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" != "v$v" ]]; then
            echo "::error::Tag ${{ github.ref_name }} doesn't match __version__ $v (expected tag v$v)"
            exit 1
          fi

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: python -m PyInstaller packaging/mecha-proxy.spec --noconfirm --log-level WARN

      - name: Self-test the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "smoke"
          $p = Start-Process -FilePath "dist\Mecha-Assemble-Proxy-Helper\Mecha-Assemble-Proxy-Helper.exe" `
                 -ArgumentList "--smoke-test", "--home", $home_dir -Wait -PassThru
          Get-Content (Join-Path $home_dir "smoke-test.txt")
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed (exit $($p.ExitCode))"; exit 1 }

      - name: Self-test the built app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          home_dir="$RUNNER_TEMP/smoke"
          "dist/Mecha-Assemble-Proxy-Helper.app/Contents/MacOS/Mecha-Assemble-Proxy-Helper" --smoke-test --home "$home_dir"
          cat "$home_dir/smoke-test.txt"
          grep -q "^ok " "$home_dir/smoke-test.txt"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Mecha-Assemble-Proxy-Helper `
            -DestinationPath "dist/Mecha-Assemble-Proxy-Helper-v${{ steps.version.outputs.version }}-windows.zip" -Force

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |   # ditto keeps the bundle's symlinks and signatures intact
          ditto -c -k --keepParent "dist/Mecha-Assemble-Proxy-Helper.app" \
            "dist/Mecha-Assemble-Proxy-Helper-v${{ steps.version.outputs.version }}-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write           # create the draft release and upload the zips
    steps:
      - uses: actions/checkout@v4   # gh needs the repo context

      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l zips
          gh release create "${{ github.ref_name }}" zips/*.zip \
            --draft --verify-tag --generate-notes \
            --title "Mecha-Assemble-Proxy-Helper ${GITHUB_REF_NAME#v}"
